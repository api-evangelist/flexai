name: FlexAI
description: >-
  FlexAI is managed inference for builders — an OpenAI-compatible API (Token
  Factory) that provides a single API key across open models for text, code,
  reasoning, vision, embeddings, image, video, and audio, priced by usage per
  model. Beyond serverless inference the platform offers dedicated GPU
  endpoints, managed LoRA/QLoRA fine-tuning, distributed training, an Agent SDK
  (in trial), and a private AI cloud (AI Factory) deployable to VPC, on-prem, or
  air-gapped environments. Because the inference API is a drop-in OpenAI
  replacement, teams point the OpenAI SDK at the FlexAI base URL and change only
  the key. FlexAI is backed by Partech and profiled in the API Evangelist
  network for its developer surface and agent-native infrastructure.
